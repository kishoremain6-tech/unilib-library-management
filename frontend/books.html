<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue · UniLib</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="books"><header id="nav"></header>
<main class="wrap"><div class="sec-h"><h1 style="font-size:2rem">Book catalogue</h1><span class="mute" id="count"></span></div>
<div class="toolbar"><input id="q" type="search" placeholder="Search title, author, ISBN or book ID" aria-label="Search"><select id="cat" aria-label="Category"></select><label class="toggle"><input type="checkbox" id="avail">Find available books only</label></div>
<div class="books" id="grid"></div><div class="pager"><button class="btn ghost sm" id="prev">Previous</button><span id="pg" class="mute"></span><button class="btn ghost sm" id="next">Next</button></div></main>
<footer>UniLib · Smart University Library Management System · Web Technology project · All book records are sample demo data</footer>
<div id="toasts" aria-live="polite"></div>
<script src="/js/app.js"></script><script src="/js/books.js"></script></body></html>
