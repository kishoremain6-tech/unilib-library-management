<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · UniLib</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="register"><header id="nav"></header>
<main class="wrap"><div class="auth card"><form id="authForm" data-mode="register" novalidate><h2>Create your student account</h2><label for="name">Full name</label><input id="name" name="name" type="text" required autocomplete="name"><p class="err" data-err="name"></p><label for="studentId">Student ID / roll number</label><input id="studentId" name="studentId" type="text" required><p class="err" data-err="studentId"></p><label for="department">Department</label><select id="department" name="department" required><option value="">Choose…</option><option>Computer Science</option><option>Information Technology</option><option>AI & Data Science</option><option>Electronics & Communication</option><option>Electrical</option><option>Mechanical</option><option>Civil</option><option>Mathematics</option><option>Physics & Chemistry</option><option>Management</option></select><p class="err" data-err="department"></p><label for="year">Year of study</label><select id="year" name="year" required><option value="">Choose…</option><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option><option value="5">Year 5</option><option value="6">Year 6</option></select><p class="err" data-err="year"></p><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"><p class="err" data-err="email"></p><label for="phone">Phone number (10 digits)</label><input id="phone" name="phone" type="tel" required><p class="err" data-err="phone"></p><label for="password">Password (8+ characters, letters and numbers)</label><input id="password" name="password" type="password" required autocomplete="new-password"><p class="err" data-err="password"></p><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password"><p class="err" data-err="confirmPassword"></p><p class="err" id="formErr"></p><button class="btn" type="submit" style="width:100%;margin-top:1rem">Create account</button></form><p class="center small mute" style="margin-top:1rem">Already registered? <a href="/login.html">Log in</a></p></div></main>
<footer>UniLib · Smart University Library Management System · Web Technology project · All book records are sample demo data</footer>
<div id="toasts" aria-live="polite"></div>
<script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
